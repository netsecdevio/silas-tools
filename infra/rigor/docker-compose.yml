services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rigor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-rigor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rigor} -d ${POSTGRES_DB:-rigor}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  rigordb:
    build:
      context: ${RIGORDB_SOURCE:-../../claude-zaphar}/rigordb
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RIGOR_MCP_PORT: ${RIGOR_MCP_PORT:-3100}
      DATABASE_URL: postgres://${POSTGRES_USER:-rigor}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rigor}?sslmode=disable
    ports:
      - "${RIGOR_MCP_PORT:-3100}:${RIGOR_MCP_PORT:-3100}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
